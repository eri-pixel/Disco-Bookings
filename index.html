<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Disco Bookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFF8EF;
    --panel: #FFFFFF;
    --panel-2: #FBF6FF;
    --border: #F0E4F7;
    --text: #2E2438;
    --muted: #8B8698;
    --muted-2: #BAB4C7;
    --coral: #FF7A5C;
    --pink: #FF3D9A;
    --teal: #17C3B2;
    --indigo: #7C6CF0;
    --amber: #FFC145;
    --sky: #2FAADC;
    --red: #FF3B5C;
    --green: #1C8A4E;
    --green-bg: #DFF7E9;
    --green-bd: #B7EAC9;
    --amber-bg: #FFF3D6;
    --amber-tx: #9A6B00;
    --amber-bd: #FCE4A6;
    --teal-bg: #E3F8F5;
    --teal-bd: #B8EBE4;
    --indigo-bg: #ECE9FF;
    --indigo-bd: #CFC9FA;
    --kids-bg: #FFF4D6;
    --kids-bd: #FCE4A6;
    --hens-bg: #FFE6F3;
    --hens-bd: #FFC2E0;
    --other-bg: #E1F3FB;
    --other-bd: #B5E0F3;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
  }
  ::selection{ background: var(--pink); color:#fff; }

  .app{ display:flex; flex-direction:column; height:100vh; }

  header{
    padding: 16px 24px 12px;
    border-bottom: 2px solid var(--border);
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    flex-shrink:0; flex-wrap:wrap; background: var(--panel);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .disco-dot{
    width:18px; height:18px; border-radius:50%;
    background: conic-gradient(from 0deg, var(--coral), var(--pink), var(--indigo), var(--teal), var(--coral));
    box-shadow: 0 0 10px rgba(46,36,56,0.18);
    animation: spin 6s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .disco-dot{ animation:none; } }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  h1{ font-family:'Poppins', sans-serif; font-size: 20px; font-weight:800; margin:0; letter-spacing:0.1px; }
  .subtitle{ color: var(--muted); font-size:12.5px; margin-top:2px; font-weight:500; }

  .header-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .add-booking-btn{
    background: var(--pink); color: #fff; border:none;
    padding: 10px 16px; border-radius:10px; font-weight:700; font-size:13.5px;
    cursor:pointer; transition: transform .12s ease, background .12s ease;
  }
  .add-booking-btn:hover{ background:#e6318a; transform: translateY(-1px); }
  .btn-share{
    background: var(--panel-2); color: var(--text); border:1.5px solid var(--border);
    padding: 10px 14px; border-radius:10px; font-weight:600; font-size:12.5px; cursor:pointer;
  }
  .btn-share:hover{ border-color: var(--sky); }
  [data-focusable]:focus-visible{ outline:2px solid var(--sky); outline-offset:2px; }

  .viewer-banner.warn{ background:#FFE9ED; color:#B3213F; border-bottom-color:#FFC2CD; font-weight:700; line-height:1.5; }
  .viewer-banner{
    background: var(--amber-bg); color: var(--amber-tx); font-size:12px; font-weight:600; text-align:center;
    padding:7px; border-bottom:1px solid var(--amber-bd); flex-shrink:0;
  }

  .tabs{
    display:flex; gap:6px; padding: 12px 24px 0; border-bottom:2px solid var(--border);
    overflow-x:auto; flex-shrink:0; background: var(--panel);
  }
  .tab{
    display:flex; align-items:center; gap:7px;
    padding: 9px 10px 9px 16px; border-radius: 10px 10px 0 0;
    font-family:'Poppins', sans-serif; font-weight:600; font-size:13.5px;
    color: var(--muted); cursor:pointer; border:1.5px solid transparent; border-bottom:none;
    background:transparent; white-space:nowrap;
  }
  .tab .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .tab.active{ color: var(--text); background: var(--bg); border-color: var(--border); }
  .tab-count{
    font-size:11px; color:var(--muted); background:var(--panel-2);
    padding:1px 7px; border-radius:20px; font-family:'Poppins',sans-serif; font-weight:700;
  }
  .tab-del{
    font-size:10px; color:var(--muted-2); background:none; border:none; cursor:pointer;
    padding:3px; border-radius:50%; line-height:1; opacity:0.55;
  }
  .tab-del:hover{ color:#fff; background:var(--red); opacity:1; }
  .add-tab{
    color: var(--muted-2); font-size:18px; padding: 9px 14px; cursor:pointer;
    background:none; border:none; border-radius:10px 10px 0 0; font-weight:700;
  }
  .add-tab:hover{ color: var(--pink); background: var(--panel-2); }

  main{ flex:1; overflow:auto; padding: 16px 24px 24px; -webkit-overflow-scrolling: touch; }
  .board{ -webkit-overflow-scrolling: touch; }

  @media (max-width: 640px){
    header{ padding:12px 16px 10px; }
    h1{ font-size:16.5px; }
    .header-actions{ gap:6px; }
    .add-booking-btn, .btn-share{ padding:8px 11px; font-size:12px; }
    .tabs{ padding:10px 16px 0; }
    main{ padding:12px 16px 18px; }
    .note-bar{ padding:7px 11px; font-size:11.5px; }
    .column{ width:210px; min-width:210px; }
    .modal{ padding:18px; }
  }

  .note-bar{
    display:flex; align-items:center; gap:10px;
    background: linear-gradient(135deg, #FFEAF6 0%, #FFF6DE 100%);
    border:2px dashed var(--pink); border-radius:10px;
    padding:8px 14px; margin: 0 0 16px;
    box-shadow: 0 3px 8px rgba(46,36,56,0.07);
    font-size:12px; line-height:1.5; font-weight:600; color: var(--text);
  }
  .note-bar.empty{ background: var(--panel-2); border-color: var(--border); font-weight:500; color:var(--muted); }
  .note-bar .pin{ font-size:15px; flex-shrink:0; }
  .note-bar .note-text{ flex:1; }
  .note-edit, .note-edit-link{
    display:inline-flex; align-items:center; gap:4px; flex-shrink:0;
    background:#fff; border:1.5px solid var(--pink); color:var(--pink);
    font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px; cursor:pointer;
  }
  .note-edit:hover, .note-edit-link:hover{ background:var(--pink); color:#fff; }

  .board{ display:flex; gap:14px; align-items:flex-start; }
  .upcoming-single{ width:100%; max-width:820px; }
  .app-version{ margin-top:28px; color: var(--muted-2); font-size:11px; font-weight:600; text-align:right; }
  .row-notes{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .filter-bar{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
  .filter-chip{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:12.5px;
    background: var(--panel); color: var(--muted); border:1.5px solid var(--border);
    padding:7px 13px; border-radius:20px;
  }
  .filter-chip:hover{ border-color: var(--pink); color: var(--text); }
  .filter-chip .fc-count{ background: var(--panel-2); color: var(--muted); border-radius:20px; padding:0 7px; font-size:11px; }
  .past-toggle{
    margin-left:auto; cursor:pointer; font-family:'Poppins',sans-serif; font-weight:700; font-size:12px;
    background: transparent; color: var(--muted); border:1.5px dashed var(--muted-2);
    padding:7px 13px; border-radius:20px;
  }
  .past-toggle:hover{ color: var(--text); border-color: var(--muted); }
  .past-toggle.active{ background: var(--text); border:1.5px solid var(--text); color:#fff; }
  .all-booking-row.past{ opacity:0.68; }
  .filter-chip .fc-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .filter-chip.type-kids .fc-dot{ background: var(--amber); }
  .filter-chip.type-hens .fc-dot{ background: var(--pink); }
  .filter-chip.type-other .fc-dot{ background: var(--sky); }
  .filter-chip.active{ background: var(--text); border-color: var(--text); color:#fff; }
  .filter-chip.active .fc-count{ background: rgba(255,255,255,0.22); color:#fff; }
  .filter-chip.active.type-kids{ background: var(--amber); border-color: var(--amber); color:#5A4300; }
  .filter-chip.active.type-kids .fc-count{ background: rgba(90,67,0,0.15); color:#5A4300; }
  .filter-chip.active.type-kids .fc-dot{ background:#5A4300; }
  .filter-chip.active.type-hens{ background: var(--pink); border-color: var(--pink); color:#fff; }
  .filter-chip.active.type-other{ background: var(--sky); border-color: var(--sky); color:#fff; }
  .filter-chip.active .fc-dot{ box-shadow: 0 0 0 2px rgba(255,255,255,0.7); }
  .section-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .section-title{ font-weight:800; font-size:16px; }
  .section-sub{ color:var(--muted); font-size:11.5px; font-weight:500; margin-top:1px; }
  .section-count{
    font-weight:700; font-size:12px; padding:2px 11px; border-radius:20px;
    background: var(--green-bg); color: var(--green);
  }
  .upcoming-section.pencilled .section-count{ background: var(--indigo-bg); color: var(--indigo); }
  .month-block{
    background: var(--panel); border:1.5px solid var(--border); border-radius:16px;
    overflow:hidden; margin-bottom:20px; box-shadow:0 2px 8px rgba(46,36,56,0.05);
  }
  .month-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 16px; background: var(--green-bg); border-bottom:2px solid var(--green-bd);
  }
  .upcoming-section.pencilled .month-head{ background: var(--indigo-bg); border-bottom-color: var(--indigo-bd); }
  .month-name{ font-weight:800; font-size:14px; letter-spacing:1.6px; color: var(--text); }
  .month-year{ font-weight:600; color: var(--muted); letter-spacing:1px; }
  .month-count{
    font-weight:700; font-size:11.5px; color: var(--muted); background:#fff;
    border:1px solid var(--border); padding:2px 10px; border-radius:20px; letter-spacing:0;
  }
  .month-rows{ padding:12px; display:flex; flex-direction:column; gap:8px; }
  .all-booking-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--panel-2); border:1.5px solid var(--border); border-left-width:5px; border-radius:12px;
    padding:10px 14px 10px 10px; cursor:pointer; transition: border-color .12s ease;
  }
  .all-booking-row:hover{ border-color: var(--sky); }
  .all-booking-main{ flex:1; min-width:0; }
  .row-date{
    flex-shrink:0; width:48px; text-align:center; background:#fff;
    border:1.5px solid var(--border); border-radius:10px; padding:5px 0;
  }
  .rd-day{ font-weight:800; font-size:17px; line-height:1.1; color: var(--text); }
  .rd-dow{ font-size:9.5px; font-weight:700; color: var(--muted); letter-spacing:0.8px; }
  .all-booking-row.type-kids{ border-left-color: var(--amber); }
  .all-booking-row.type-hens{ border-left-color: var(--pink); }
  .all-booking-row.type-other{ border-left-color: var(--sky); }
  .all-booking-row.type-kids .row-date{ background: var(--kids-bg); border-color: var(--kids-bd); }
  .all-booking-row.type-hens .row-date{ background: var(--hens-bg); border-color: var(--hens-bd); }
  .all-booking-row.type-other .row-date{ background: var(--other-bg); border-color: var(--other-bd); }
  .all-booking-row .row-date.tbc .rd-day{ font-size:13px; }
  .all-booking-row .row-date.tbc{ border-style:dashed; }
  .column{
    background: var(--panel); border:1.5px solid var(--border); border-radius:14px;
    width: 246px; min-width:246px; display:flex; flex-direction:column; max-height:100%;
  }
  .column.closed{ opacity:0.7; }
  .column.drag-over{ border-color: var(--sky); box-shadow: 0 0 0 2px rgba(47,170,220,0.25); }
  .column-head{ padding: 12px 14px 8px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .column-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size:12.5px; }
  .column-count{ color: var(--muted-2); font-size:11.5px; font-weight:600; }
  .card-list{ flex:1; overflow-y:auto; padding: 4px 10px 12px; display:flex; flex-direction:column; gap:8px; min-height: 60px; }
  .column-footer{
    padding:9px 13px; border-top:1.5px dashed var(--green-bd); background: var(--green-bg);
    border-radius:0 0 13px 13px; text-align:right; font-size:12.5px; font-weight:700; color:var(--green);
    flex-shrink:0;
  }

  .card{
    background: var(--panel-2); border:1.5px solid var(--border); border-left-width:5px; border-radius:12px;
    padding: 10px 11px; cursor:grab; position:relative;
  }
  .card:active{ cursor:grabbing; }
  .card.dragging{ opacity:0.35; }
  .card.overdue{ border-color: var(--red); box-shadow: 0 0 0 2px rgba(255,59,92,0.18); }
  .card-client{ font-weight:700; font-size:13.5px; margin-bottom:3px; padding-right:16px; }
  .card-line{ color: var(--muted); font-size:11.5px; margin-top:2px; font-weight:500; }
  .card-tags{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .card-tag{ background: var(--panel); border:1px solid var(--border); border-radius:6px; padding:2px 7px; font-size:10.5px; color:var(--muted); font-weight:600; }
  .card-tag.tag-paid{ background: var(--green-bg); color:var(--green); border-color:var(--green-bd); }
  .card-tag.tag-sent{ background: var(--amber-bg); color:var(--amber-tx); border-color:var(--amber-bd); }
  .card-overdue-flag{ color: var(--red); font-size:10.5px; font-weight:700; margin-top:6px; display:flex; align-items:center; gap:4px; }
  .followup-countdown{ color: var(--indigo); font-size:10.5px; font-weight:700; margin-top:6px; display:flex; align-items:center; gap:4px; }
  .card-del{
    position:absolute; top:8px; right:8px; background:none; border:none;
    color: var(--muted-2); font-size:13px; cursor:pointer; line-height:1; padding:4px;
  }
  .card-del:hover{ color: var(--pink); }
  .empty-col{ color: var(--muted-2); font-size:12px; text-align:center; padding: 18px 8px; border: 1.5px dashed var(--border); border-radius:8px; margin-top:2px; font-weight:500; }

  .overlay{
    position:fixed; inset:0; background:rgba(46,36,56,0.45); backdrop-filter: blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{ background: var(--panel); border:1.5px solid var(--border); border-radius:18px; width: 400px; max-width:100%; padding:22px; max-height:88vh; overflow-y:auto; }
  .modal.small{ width:340px; }
  .modal h2{ font-family:'Poppins',sans-serif; font-size:17px; font-weight:700; margin:0 0 16px; }
  .modal p.confirm-text{ font-size:13.5px; color:var(--text); margin:0 0 18px; line-height:1.5; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  .field input, .field textarea, .field select{
    width:100%; background: var(--bg); border:1.5px solid var(--border); border-radius:9px;
    padding:9px 10px; color: var(--text); font-family:'Poppins',sans-serif; font-size:13.5px;
  }
  .field textarea{ resize:vertical; min-height:52px; }
  .field textarea.note-textarea{ min-height:90px; }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:2px solid var(--sky); outline-offset:1px; }
  .checkbox-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
  .chk{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; color:var(--text); cursor:pointer; }
  .chk input{ width:16px; height:16px; accent-color: var(--pink); cursor:pointer; }
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:6px; }
  .modal-actions-right{ display:flex; gap:8px; }
  .btn-ghost{ background:none; border:1.5px solid var(--border); color: var(--muted); padding:9px 14px; border-radius:9px; font-size:13px; cursor:pointer; font-weight:600; }
  .btn-danger{ background:none; border:1.5px solid var(--red); color: var(--red); padding:9px 14px; border-radius:9px; font-size:13px; cursor:pointer; font-weight:600; }
  .btn-danger-solid{ background: var(--red); border:none; color:#fff; padding:9px 16px; border-radius:9px; font-size:13px; cursor:pointer; font-weight:700; }
  .btn-primary{ background: var(--pink); border:none; color:#fff; padding:9px 16px; border-radius:9px; font-size:13px; cursor:pointer; font-weight:700; }
  .btn-primary:hover{ background:#e6318a; }
  .btn-link{ background:none; border:none; color: var(--sky); font-size:12px; cursor:pointer; padding:0; text-align:left; margin-bottom:14px; font-weight:600; }
  .color-picker{ display:flex; gap:7px; margin-top:2px; }
  .swatch{ width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .swatch.selected{ border-color: var(--text); }
  .readonly-row{ font-size:13.5px; margin-bottom:10px; }
  .readonly-row span{ color:var(--muted); font-size:11.5px; display:block; margin-bottom:2px; font-weight:600; }

  .session-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .session-row{ display:flex; gap:10px; align-items:flex-start; background:var(--bg); border:1.5px solid var(--border); border-radius:10px; padding:9px 11px; }
  .session-row .dot{ width:10px; height:10px; border-radius:50%; margin-top:4px; flex-shrink:0; }
  .session-client{ font-weight:700; font-size:13.5px; }
  .session-meta{ color:var(--muted); font-size:11.5px; font-weight:500; margin-top:1px; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background: var(--text); border:1px solid var(--border); color:#fff;
    padding:9px 16px; border-radius:10px; font-size:12.5px; z-index:60; opacity:0;
    transition: opacity .2s ease; max-width:88vw; text-align:center; font-weight:600;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <div class="brand">
        <div class="disco-dot"></div>
        <h1>Disco Bookings</h1>
      </div>
    </div>
    <div class="header-actions" id="headerActions"></div>
  </header>

  <div id="viewerBanner"></div>
  <div class="tabs" id="tabs"></div>

  <main>
    <div class="note-bar" id="noteBar"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="board" id="board"><div class="empty-col" style="width:100%; max-width:400px;">Loading your bookings…</div></div>
    <div class="app-version" id="appVersion"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   CONFIG — paste your Apps Script Web App URL here after deploying it.
   ====================================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwCuewKD1tpFC0KDWmpssMxbiUMl9x_DnFGc_QqnUDQNAgKL7CYZ7lPkm9iFAKOPqol/exec'
};

const STATUSES = [
  { id:'enquiry',            label:'Enquiry' },
  { id:'quoted',             label:'Quoted' },
  { id:'awaiting',           label:'Follow-up Sent' },
  { id:'no_response',        label:'No Response' },
  { id:'awaiting_response',  label:'Awaiting for Response' },
  { id:'confirmed',          label:'Confirmed' },
  { id:'staffed',            label:'Staffed' },
  { id:'completed',          label:'Completed' },
  { id:'cancelled',          label:'Cancelled' },
  { id:'archive',            label:'Archive' },
];
const CLOSED_STATUSES = ['completed', 'cancelled', 'archive'];
const FOLLOWUP_STATUSES = ['enquiry', 'quoted', 'awaiting'];
const SOURCES = ['Email', 'Form', 'Referral', 'Website', 'CrowdPleaser'];

const APP_VERSION = 'Disco Bookings · version 1';
const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
const EDIT_KEY_STORAGE = 'discoBookingsEditKey';

const params = new URLSearchParams(window.location.search);
const isViewer = params.get('view') === '1';

function emptyState(){
  return { cards: [], allNote: '', pendingNote: '' };
}

function defaultState(){
  return {
    cards: SEED_BOOKINGS.map(b => ({
      id: uid(), status: b.s || 'confirmed', updatedAt: Date.now(),
      client: b.c, eventType: b.e, eventDate: b.d, eventMonth: b.m || '', notes: b.n || ''
    })),
    allNote: '', pendingNote: ''
  };
}

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

let state = null;
let activeTab = 'CONFIRMED';
let activeFilter = 'ALL';
let showPast = false;
let loadFailed = false;
let seededFresh = false;
let previewMode = false;

/* ---------------- Storage (Google Sheet via Apps Script) ---------------- */

let memoryKey = '';
function getEditKey(){ try{ return localStorage.getItem(EDIT_KEY_STORAGE) || memoryKey; }catch(e){ return memoryKey; } }
function setEditKey(k){ memoryKey = k; try{ localStorage.setItem(EDIT_KEY_STORAGE, k); }catch(e){} }

async function loadState(){
  if(CONFIG.API_URL.indexOf('PASTE_') === 0){
    state = defaultState();     // preview: show the real screen with the bookings list
    loadFailed = true;          // ...but never save anything
    previewMode = true;
    return;
  }
  try{
    const url = CONFIG.API_URL + (CONFIG.API_URL.indexOf('?') > -1 ? '&' : '?') + 'cb=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    const data = await res.json();
    if(data && Array.isArray(data.cards)){
      state = data;
    } else if(data && Object.keys(data).length === 0){
      state = defaultState();     // brand-new empty sheet: start with the bookings list
      seededFresh = true;
    } else {
      state = emptyState();
      loadFailed = true;
    }
  }catch(e){
    state = emptyState();
    loadFailed = true;
  }
  if(!state.cards) state.cards = [];
  if(state.allNote === undefined) state.allNote = '';
  if(state.pendingNote === undefined) state.pendingNote = '';
}

let saveTimeout = null;
const LOAD_FAILED_MSG = CONFIG.API_URL.indexOf('PASTE_') === 0
  ? "PREVIEW ONLY — this is how Disco Bookings will look. Nothing you change here is saved, because it isn't connected to its Google Sheet yet."
  : "Couldn't load your saved bookings, so saving is paused to protect them. Refresh the page. If it keeps happening, in Apps Script check Deploy > Manage deployments > \"Who has access\" is set to Anyone.";
function saveState(onDone){
  if(isViewer) return;
  if(loadFailed){
    setBanner(LOAD_FAILED_MSG);
    showToast('Not saved — the board could not load your data');
    if(onDone) onDone(false);
    return;
  }
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    const key = getEditKey();
    if(!key){ openEditKeyModal(() => saveState(onDone)); return; }
    try{
      const body = new URLSearchParams();
      body.set('key', key);
      body.set('data', JSON.stringify(state));
      const res = await fetch(CONFIG.API_URL, { method: 'POST', body });
      const result = await res.json();
      if(!result.ok){
        setBanner(result.error && result.error !== 'Invalid edit key'
          ? 'Your last change did NOT save — ' + result.error
          : 'Your last change did NOT save — your edit key was not accepted. Tap 🔑 Edit key and re-enter it.');
        if(onDone) onDone(false);
      } else {
        setBanner('');
        if(onDone) onDone(true);
      }
    }catch(e){
      setBanner('Your last change did NOT save — could not reach the sheet. Check your internet, then try again.');
      if(onDone) onDone(false);
    }
  }, 500);
}

function openEditKeyModal(onSaved, onSkip){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal small">
        <h2>🔑 Enter your edit key</h2>
        <p class="confirm-text">This is the private key you set in the Apps Script backend (EDIT_KEY). It's saved on this device only, so you won't need to enter it again here.</p>
        <div class="field">
          <input id="f-editkey" type="password" placeholder="Your edit key">
        </div>
        <div class="modal-actions"><div></div><button class="btn-primary" id="saveKeyBtn">Save key</button></div>
      </div>
    </div>
  `;
  document.getElementById('saveKeyBtn').onclick = () => {
    const val = document.getElementById('f-editkey').value.trim();
    if(!val){ showToast('Enter your edit key'); return; }
    setEditKey(val);
    closeModal();
    if(onSaved) onSaved();
  };
  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay'){ closeModal(); if(onSkip) onSkip(); }
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });
}

function parsePrice(str){
  if(!str) return 0;
  const match = String(str).replace(/,/g, '').match(/[\d.]+/);
  return match ? parseFloat(match[0]) : 0;
}

function extraTotal(card){
  const count = parseFloat(card.extraCount) || 0;
  const rate = parsePrice(card.extraRate);
  return count * rate;
}

function formatMoney(n){
  return '$' + n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function noteDisplay(note){
  return (note || '').split('\n').map(s => s.trim()).filter(Boolean).join('  •  ');
}

function copyViewLink(){
  const url = new URL(window.location.href);
  url.searchParams.set('view', '1');
  const link = url.toString();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(() => showToast('View-only link copied'), () => showToast(link));
  } else {
    showToast(link);
  }
}

function setBanner(msg){
  const el = document.getElementById('viewerBanner');
  el.innerHTML = msg ? `<div class="viewer-banner warn">⚠ ${escapeHtml(msg)}</div>` : '';
}

function renderViewerBanner(){ setBanner(''); }

function isOverdue(card){
  if(!FOLLOWUP_STATUSES.includes(card.status)) return false;
  return daysLeftForFollowup(card) <= 0;
}

function daysLeftForFollowup(card){
  const elapsedMs = Date.now() - (card.updatedAt || 0);
  const elapsedDays = Math.floor(elapsedMs / (24 * 60 * 60 * 1000));
  return 7 - elapsedDays;
}

function followupIndicatorHtml(card){
  if(!FOLLOWUP_STATUSES.includes(card.status)) return '';
  if(isOverdue(card)) return '<div class="card-overdue-flag">⏱ Follow up — no update in 7+ days</div>';
  const daysLeft = daysLeftForFollowup(card);
  return `<div class="followup-countdown">⏳ ${daysLeft} day${daysLeft === 1 ? '' : 's'} left to follow up</div>`;
}

  renderHeaderActions();
  renderTabs();
  renderNoteBar();
  renderFilterBar();
  renderBoard();
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  [
    { id:'CONFIRMED', label:'Upcoming Bookings',      count:getConfirmedUpcoming().length },
    { id:'PENDING',   label:'Tentative Bookings',     count:getPencilledIn().length },
  ].forEach(t => {
    const el = document.createElement('button');
    el.className = 'tab' + (activeTab === t.id ? ' active' : '');
    el.innerHTML = `${t.label} <span class="tab-count">${t.count}</span>`;
    el.addEventListener('click', () => { activeTab = t.id; render(); });
    tabs.appendChild(el);
  });
}

function currentNoteKey(){ return activeTab === 'CONFIRMED' ? 'allNote' : 'pendingNote'; }

function renderNoteBar(){
  const bar = document.getElementById('noteBar');
  const note = state[currentNoteKey()];
  bar.style.display = '';
  if(note && note.trim()){
    bar.className = 'note-bar';
    bar.innerHTML = `
      <span class="pin">📌</span>
      <span class="note-text">${escapeHtml(noteDisplay(note))}</span>
      ${!isViewer ? '<button class="note-edit" id="editNoteBtn">✎ Edit</button>' : ''}
    `;
  } else if(!isViewer){
    bar.className = 'note-bar empty';
    bar.innerHTML = `
      <span class="pin">📌</span>
      <span class="note-text">No note yet</span>
      <button class="note-edit-link" id="editNoteBtn">+ Add note</button>
    `;
  } else {
    bar.className = 'note-bar';
    bar.innerHTML = '';
    bar.style.display = 'none';
  }
  if(!isViewer){
    const btn = document.getElementById('editNoteBtn');
    if(btn) btn.onclick = () => openEditNoteModal();
  }
}

function openEditNoteModal(){
  const key = currentNoteKey();
  const title = activeTab === 'CONFIRMED' ? 'Upcoming Bookings' : 'Tentative Bookings';
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>📌 Note — ${title}</h2>
        <div class="field">
          <label for="f-note">One line per point — shown joined with dots in a compact bar</label>
          <textarea id="f-note" class="note-textarea" placeholder="e.g. a reminder for this list...">${escapeHtml(state[key] || '')}</textarea>
        </div>
        <div class="modal-actions"><div></div><div class="modal-actions-right">
          <button class="btn-ghost" id="cancelBtn">Cancel</button>
          <button class="btn-primary" id="saveNoteBtn">Save note</button>
        </div></div>
      </div>
    </div>
  `;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('saveNoteBtn').onclick = () => {
    state[key] = document.getElementById('f-note').value.trim();
    saveState();
    closeModal();
    renderNoteBar();
  };
}

const FILTERS = [
  { id:'ALL',   label:'All' },
  { id:'KIDS',  label:'Kids Party' },
  { id:'HENS',  label:'Hens Party' },
  { id:'OTHER', label:'Other bookings' },
];

function bookingType(c){
  const text = (c.eventType ? c.eventType : (c.client || '')).toLowerCase();
  if(/\bkid'?s?\s+party/.test(text)) return 'KIDS';
  if(/\bhen'?s?\s+party/.test(text)) return 'HENS';
  return 'OTHER';
}

function applyFilter(items){
  return activeFilter === 'ALL' ? items : items.filter(c => bookingType(c) === activeFilter);
}

function sortKey(c){ return c.eventDate || (c.eventMonth ? c.eventMonth + '-99' : ''); }

function byDateUndatedLast(a, b){
  const ka = sortKey(a), kb = sortKey(b);
  if(!ka && !kb) return 0;
  if(!ka) return 1;
  if(!kb) return -1;
  return ka > kb ? 1 : (ka < kb ? -1 : 0);
}

function isUpcoming(c){
  const todayISO = todayLocalISO();
  if(c.eventDate) return c.eventDate >= todayISO;
  if(c.eventMonth) return c.eventMonth >= todayISO.slice(0, 7);
  return true;
}

function getConfirmedUpcoming(){
  return state.cards.filter(c => CONFIRMED_VIEW_STATUSES.includes(c.status) && isUpcoming(c)).sort(byDateUndatedLast);
}

function getPencilledIn(){
  return state.cards.filter(c => PENCILLED_STATUSES.includes(c.status) && isUpcoming(c)).sort(byDateUndatedLast);
}

function getConfirmedAll(){
  return state.cards.filter(c => CONFIRMED_VIEW_STATUSES.includes(c.status)).sort(byDateUndatedLast);
}

function pastConfirmedCount(){
  return state.cards.filter(c => CONFIRMED_VIEW_STATUSES.includes(c.status) && !isUpcoming(c)).length;
}

function currentBaseItems(){
  if(activeTab === 'CONFIRMED') return showPast ? getConfirmedAll() : getConfirmedUpcoming();
  return getPencilledIn();
}

function monthKeyOf(c){
  return c.eventDate ? c.eventDate.slice(0, 7) : (c.eventMonth || 'none');
}

function monthParts(ym){
  const d = new Date(ym + '-01T00:00:00');
  return { name: d.toLocaleDateString('en-AU', { month:'long' }).toUpperCase(), year: String(d.getFullYear()) };
}

function dateChipHtml(c){
  if(c.eventDate){
    const d = new Date(c.eventDate + 'T00:00:00');
    if(!isNaN(d)){
      return `<div class="row-date"><div class="rd-day">${String(d.getDate()).padStart(2, '0')}</div><div class="rd-dow">${d.toLocaleDateString('en-AU', { weekday:'short' }).toUpperCase()}</div></div>`;
    }
  }
  return `<div class="row-date tbc"><div class="rd-day">TBC</div><div class="rd-dow">DATE</div></div>`;
}

function renderFilterBar(){
  const bar = document.getElementById('filterBar');
  const base = currentBaseItems();
  bar.innerHTML = '';
  FILTERS.forEach(f => {
    const count = f.id === 'ALL' ? base.length : base.filter(c => bookingType(c) === f.id).length;
    const el = document.createElement('button');
    el.className = 'filter-chip type-' + f.id.toLowerCase() + (activeFilter === f.id ? ' active' : '');
    el.innerHTML = `${f.id === 'ALL' ? '' : '<span class="fc-dot"></span>'}${f.label} <span class="fc-count">${count}</span>`;
    el.addEventListener('click', () => { activeFilter = f.id; render(); });
    bar.appendChild(el);
  });
  if(activeTab === 'CONFIRMED'){
    const pastN = pastConfirmedCount();
    if(pastN > 0 || showPast){
      const t = document.createElement('button');
      t.className = 'past-toggle' + (showPast ? ' active' : '');
      t.textContent = showPast ? 'Hide past bookings' : `Show past bookings (${pastN})`;
      t.addEventListener('click', () => { showPast = !showPast; render(); });
      bar.appendChild(t);
    }
  }
}

function bookingRowHtml(c){
  const statusObj = STATUSES.find(s => s.id === c.status);
  const timeRange = [c.eventTime, c.eventEndTime].filter(Boolean).join(' – ');
  const metaLine = [c.eventType, timeRange, (!c.eventDate ? 'Date to be confirmed' : '')].filter(Boolean).join(' · ');
  const tags = [];
  if(c.pax) tags.push(`${c.pax} pax`);
  if(c.price) tags.push(c.price);
  if(c.source) tags.push(`via ${c.source}`);
  if(parseFloat(c.extraCount) > 0) tags.push(`+${c.extraCount} extra (${formatMoney(extraTotal(c))})`);
  return `
    <div class="all-booking-row type-${bookingType(c).toLowerCase()}${isUpcoming(c) ? '' : ' past'}" data-id="${c.id}">
      ${dateChipHtml(c)}
      <div class="all-booking-main">
        <div class="card-client">${escapeHtml(c.client)}</div>
        ${metaLine ? `<div class="card-line">${escapeHtml(metaLine)}</div>` : ''}
        ${c.location ? `<div class="card-line">${escapeHtml(c.location)}</div>` : ''}
        ${c.staff ? `<div class="card-line">Staff: ${escapeHtml(c.staff)}</div>` : ''}
        ${c.notes ? `<div class="card-line row-notes">${escapeHtml(c.notes)}</div>` : ''}
        ${tags.length ? `<div class="card-tags">${tags.map(t => `<span class="card-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        ${invoiceBadgeHtml(c)}
        ${checklistBadgeHtml(c)}
        ${followupIndicatorHtml(c)}
      </div>
      <span class="card-tag">${escapeHtml(statusObj ? statusObj.label : c.status)}</span>
    </div>
  `;
}

function upcomingSectionHtml(title, subtitle, cls, items, emptyText){
  const groups = [];
  items.forEach(c => {
    const key = monthKeyOf(c);
    let group = groups[groups.length - 1];
    if(!group || group.key !== key){
      group = { key, items: [] };
      groups.push(group);
    }
    group.items.push(c);
  });

  let body = '';
  if(items.length === 0){
    body = `<div class="empty-col">${emptyText}</div>`;
  } else {
    groups.forEach(group => {
      let head;
      if(group.key === 'none'){
        head = `<span class="month-name">DATE TBC</span>`;
      } else {
        const mp = monthParts(group.key);
        head = `<span class="month-name">${mp.name}<span class="month-year"> ${mp.year}</span></span>`;
      }
      body += `
        <div class="month-block">
          <div class="month-head">${head}<span class="month-count">${group.items.length} booking${group.items.length === 1 ? '' : 's'}</span></div>
          <div class="month-rows">${group.items.map(bookingRowHtml).join('')}</div>
        </div>`;
    });
  }

  return `
    <section class="upcoming-section ${cls}">
      ${body}
    </section>
  `;
}

function renderBoard(){
  const board = document.getElementById('board');
  const items = applyFilter(currentBaseItems());
  const f = FILTERS.find(x => x.id === activeFilter);
  const html = activeTab === 'CONFIRMED'
    ? upcomingSectionHtml('Upcoming Bookings', showPast ? 'Confirmed, including past bookings' : 'Confirmed and coming up', 'confirmed', items,
        activeFilter === 'ALL' ? 'No confirmed bookings coming up' : `No ${f.label} in the confirmed list`)
    : upcomingSectionHtml('Tentative Bookings', 'Possible bookings, still waiting on a yes', 'pencilled', items,
        activeFilter === 'ALL' ? 'No tentative bookings right now' : `No ${f.label} in the tentative list`);
  board.innerHTML = `<div class="upcoming-single">${html}</div>`;
  board.querySelectorAll('.all-booking-row').forEach(row => {
    row.addEventListener('click', () => {
      const card = state.cards.find(c => c.id === row.dataset.id);
      if(card) openBookingModal(card);
    });
  });
}

const PENCILLED_STATUSES = ['enquiry', 'quoted', 'awaiting', 'awaiting_response'];
const CONFIRMED_VIEW_STATUSES = ['confirmed', 'staffed'];

function invoiceBadgeHtml(card){
  const badges = [];
  if(card.diPaid) badges.push('<span class="card-tag tag-paid">DI paid</span>');
  else if(card.diSent) badges.push('<span class="card-tag tag-sent">DI sent</span>');
  if(card.fiPaid) badges.push('<span class="card-tag tag-paid">FI paid</span>');
  else if(card.fiSent) badges.push('<span class="card-tag tag-sent">FI sent</span>');
  return badges.length ? `<div class="card-tags">${badges.join('')}</div>` : '';
}

function checklistBadgeHtml(card){
  const badges = [];
  if(card.addedConnecteam) badges.push('<span class="card-tag tag-paid">Connecteam ✓</span>');
  if(card.addedMasterSheet) badges.push('<span class="card-tag tag-paid">Master Sheet ✓</span>');
  return badges.length ? `<div class="card-tags">${badges.join('')}</div>` : '';
}

function cardColor(card){
  return { KIDS:'var(--amber)', HENS:'var(--pink)', OTHER:'var(--sky)' }[bookingType(card)];
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function openConfirmModal(message, onConfirm){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal small">
        <h2>Are you sure?</h2>
        <p class="confirm-text">${escapeHtml(message)}</p>
        <div class="modal-actions"><div></div><div class="modal-actions-right">
          <button class="btn-ghost" id="confCancel">Cancel</button>
          <button class="btn-danger-solid" id="confYes">Delete</button>
        </div></div>
      </div>
    </div>
  `;
  document.getElementById('confCancel').onclick = closeModal;
  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });
  document.getElementById('confYes').onclick = () => { closeModal(); onConfirm(); };
}

function invoiceFieldsHtml(card){
  const d = card || {};
  return `
  <div class="field">
    <label>Invoicing</label>
    <div class="checkbox-grid">
      <label class="chk"><input type="checkbox" id="f-di-sent" ${d.diSent ? 'checked' : ''}> DI sent</label>
      <label class="chk"><input type="checkbox" id="f-di-paid" ${d.diPaid ? 'checked' : ''}> DI paid</label>
      <label class="chk"><input type="checkbox" id="f-fi-sent" ${d.fiSent ? 'checked' : ''}> FI sent</label>
      <label class="chk"><input type="checkbox" id="f-fi-paid" ${d.fiPaid ? 'checked' : ''}> FI paid</label>
    </div>
  </div>
  <div class="field">
    <label>Checklist</label>
    <div class="checkbox-grid">
      <label class="chk"><input type="checkbox" id="f-added-connecteam" ${d.addedConnecteam ? 'checked' : ''}> Added to Connecteam</label>
      <label class="chk"><input type="checkbox" id="f-added-mastersheet" ${d.addedMasterSheet ? 'checked' : ''}> Added to Master Sheet</label>
    </div>
  </div>`;
}

function sourceOptionsHtml(selected){
  const opts = [''].concat(SOURCES);
  return opts.map(o => `<option value="${o}" ${o === (selected || '') ? 'selected' : ''}>${o || '—'}</option>`).join('');
}

function openBookingModal(card){
  const root = document.getElementById('modalRoot');
  const editing = !!card;

  if(isViewer){
    const timeRange = [card.eventTime, card.eventEndTime].filter(Boolean).join(' – ');
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h2>${escapeHtml(card.client)}</h2>
          <div class="readonly-row"><span>Event</span>${escapeHtml(card.eventType || '—')}</div>
          <div class="readonly-row"><span>Status</span>${escapeHtml((STATUSES.find(x => x.id === card.status) || {label: card.status}).label)}</div>
          <div class="readonly-row"><span>Source</span>${escapeHtml(card.source || '—')}</div>
          <div class="readonly-row"><span>Date</span>${escapeHtml(formatDate(card.eventDate) || (card.eventMonth ? monthParts(card.eventMonth).name.charAt(0) + monthParts(card.eventMonth).name.slice(1).toLowerCase() + ' ' + monthParts(card.eventMonth).year + ' (date to be confirmed)' : '—'))}</div>
          <div class="readonly-row"><span>Time</span>${escapeHtml(timeRange || '—')}</div>
          <div class="readonly-row"><span>Location</span>${escapeHtml(card.location || '—')}</div>
          <div class="readonly-row"><span>PAX</span>${escapeHtml(card.pax || '—')}</div>
          <div class="readonly-row"><span>Price</span>${escapeHtml(card.price || '—')}</div>
          <div class="readonly-row"><span>Extras</span>${parseFloat(card.extraCount) > 0 ? escapeHtml(`${card.extraCount} × ${card.extraRate || '—'} = ${formatMoney(extraTotal(card))}`) : '—'}</div>
          ${card.staff ? `<div class="readonly-row"><span>Staff assigned</span>${escapeHtml(card.staff)}</div>` : ''}
          <div class="readonly-row"><span>Notes</span>${escapeHtml(card.notes || '—')}</div>
          <div class="modal-actions"><div></div><button class="btn-ghost" id="cancelBtn">Close</button></div>
        </div>
      </div>
    `;
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });
    return;
  }

  const initialStatusChoice = (editing ? CONFIRMED_VIEW_STATUSES.includes(card.status) : activeTab === 'CONFIRMED') ? 'confirmed' : 'not_confirmed';

  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>${editing ? 'Edit booking' : (activeTab === 'CONFIRMED' ? 'Add confirmed booking' : 'Add tentative booking')}</h2>
        <div class="field">
          <label for="f-client">Client name</label>
          <input id="f-client" type="text" placeholder="e.g. Sarah Nguyen" value="${editing ? escapeHtml(card.client) : ''}">
        </div>
        <div class="field">
          <label for="f-event-type">Event type</label>
          <input id="f-event-type" type="text" placeholder="e.g. Silent Disco, Kids Party" value="${editing ? escapeHtml(card.eventType || '') : ''}">
        </div>
        <div class="field">
          <label for="f-status">Booking status</label>
          <select id="f-status">
            <option value="confirmed" ${initialStatusChoice === 'confirmed' ? 'selected' : ''}>Confirmed</option>
            <option value="not_confirmed" ${initialStatusChoice === 'not_confirmed' ? 'selected' : ''}>Tentative</option>
          </select>
        </div>
        <div class="field">
          <label for="f-source">Booking source</label>
          <select id="f-source">${sourceOptionsHtml(editing ? card.source : '')}</select>
        </div>
        <div class="field">
          <label for="f-date">Event date</label>
          <input id="f-date" type="date" value="${editing ? escapeHtml(card.eventDate || '') : ''}">
        </div>
        <div class="field">
          <label for="f-month">No exact date yet? Pick the month instead</label>
          <input id="f-month" type="month" value="${editing ? escapeHtml(card.eventMonth || '') : ''}">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-time">Start time</label>
            <input id="f-time" type="text" placeholder="e.g. 2:00 PM" value="${editing ? escapeHtml(card.eventTime || '') : ''}">
          </div>
          <div class="field">
            <label for="f-endtime">End time</label>
            <input id="f-endtime" type="text" placeholder="e.g. 4:00 PM" value="${editing ? escapeHtml(card.eventEndTime || '') : ''}">
          </div>
        </div>
        <div class="field">
          <label for="f-location">Location</label>
          <input id="f-location" type="text" placeholder="e.g. Parramatta Community Hall" value="${editing ? escapeHtml(card.location || '') : ''}">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-pax">PAX</label>
            <input id="f-pax" type="text" placeholder="e.g. 25" value="${editing ? escapeHtml(card.pax || '') : ''}">
          </div>
          <div class="field">
            <label for="f-price">Price</label>
            <input id="f-price" type="text" placeholder="e.g. $650" value="${editing ? escapeHtml(card.price || '') : ''}">
          </div>
        </div>
        <div class="field">
          <label>Extras (extra kids / extra guests)</label>
          <div class="field-row">
            <div class="field">
              <input id="f-extra-count" type="text" placeholder="Extra count (e.g. 3)" value="${editing ? escapeHtml(card.extraCount || '') : ''}">
            </div>
            <div class="field">
              <input id="f-extra-rate" type="text" placeholder="Rate per extra (e.g. $8)" value="${editing ? escapeHtml(card.extraRate || '') : ''}">
            </div>
          </div>
          <div class="card-line" id="extraTotalPreview">Extra total: $0.00</div>
        </div>
        <div class="field">
          <label for="f-staff">Staff assigned</label>
          <input id="f-staff" type="text" placeholder="e.g. Sarah, Mike" value="${editing ? escapeHtml(card.staff || '') : ''}">
        </div>
        ${invoiceFieldsHtml(editing ? card : null)}
        <div class="field">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes" placeholder="Special requests...">${editing ? escapeHtml(card.notes || '') : ''}</textarea>
        </div>
        ${(editing && FOLLOWUP_STATUSES.includes(card.status)) ? `
        <div class="card-line" style="margin-bottom:8px;">${isOverdue(card) ? '⏱ Follow-up overdue' : `⏳ ${daysLeftForFollowup(card)} day${daysLeftForFollowup(card) === 1 ? '' : 's'} left to follow up`}</div>
        <button class="btn-link" id="resetTimerBtn">Reset follow-up timer (mark as followed up today)</button>` : ''}
        <div class="modal-actions">
          <div>${editing ? '<button class="btn-danger" id="deleteBtn">Delete</button>' : ''}</div>
          <div class="modal-actions-right">
            <button class="btn-ghost" id="cancelBtn">Cancel</button>
            <button class="btn-primary" id="saveBtn">${editing ? 'Save changes' : 'Add booking'}</button>
          </div>
        </div>
      </div>
    </div>
  `;

  const extraCountEl = document.getElementById('f-extra-count');
  const extraRateEl = document.getElementById('f-extra-rate');
  const extraPreviewEl = document.getElementById('extraTotalPreview');
  function updateExtraPreview(){
    const count = parseFloat(extraCountEl.value) || 0;
    const rate = parsePrice(extraRateEl.value);
    extraPreviewEl.textContent = `Extra total: ${formatMoney(count * rate)}`;
  }
  extraCountEl.addEventListener('input', updateExtraPreview);
  extraRateEl.addEventListener('input', updateExtraPreview);
  updateExtraPreview();

  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });

  if(editing){
    document.getElementById('deleteBtn').onclick = () => {
      openConfirmModal(`Remove ${card.client} from Disco Bookings?`, () => {
        state.cards = state.cards.filter(c => c.id !== card.id);
        saveState(); render();
      });
    };
    document.getElementById('resetTimerBtn')?.addEventListener('click', () => {
      card.updatedAt = Date.now();
      saveState(); closeModal(); render();
      showToast('Follow-up timer reset');
    });
  }

  document.getElementById('saveBtn').onclick = () => {
    const client = document.getElementById('f-client').value.trim();
    if(!client){ showToast('Add a client name first'); return; }
    const data = {
      client,
      eventType: document.getElementById('f-event-type').value.trim(),
      eventMonth: document.getElementById('f-date').value ? '' : document.getElementById('f-month').value,
      source: document.getElementById('f-source').value,
      eventDate: document.getElementById('f-date').value,
      eventTime: document.getElementById('f-time').value.trim(),
      eventEndTime: document.getElementById('f-endtime').value.trim(),
      location: document.getElementById('f-location').value.trim(),
      pax: document.getElementById('f-pax').value.trim(),
      price: document.getElementById('f-price').value.trim(),
      extraCount: document.getElementById('f-extra-count').value.trim(),
      extraRate: document.getElementById('f-extra-rate').value.trim(),
      notes: document.getElementById('f-notes').value.trim(),
      diSent: document.getElementById('f-di-sent').checked,
      diPaid: document.getElementById('f-di-paid').checked,
      fiSent: document.getElementById('f-fi-sent').checked,
      fiPaid: document.getElementById('f-fi-paid').checked,
      addedConnecteam: document.getElementById('f-added-connecteam').checked,
      addedMasterSheet: document.getElementById('f-added-mastersheet').checked,
    };
    const staffEl = document.getElementById('f-staff');
    data.staff = staffEl ? staffEl.value.trim() : (editing ? (card.staff || '') : '');
    const statusChoice = document.getElementById('f-status').value;
    const toStatus = statusChoice === 'confirmed' ? 'confirmed' : 'enquiry';
    if(editing){
      Object.assign(card, data);
      if(statusChoice !== initialStatusChoice){ card.status = toStatus; }
      card.updatedAt = Date.now();
    } else {
      state.cards.push({
        id: uid(), status: toStatus,
        updatedAt: Date.now(), ...data
      });
    }
    saveState();
    closeModal();
    render();
  };
  document.getElementById('f-client').focus();
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

function todayLocalISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function checkSessionsToday(){
  const todayISO = todayLocalISO();
  const sessions = state.cards.filter(c => c.eventDate === todayISO && c.status !== 'cancelled');
  if(sessions.length === 0) return;
  const root = document.getElementById('modalRoot');
  const rows = sessions.map(c => {
    const time = [c.eventTime, c.eventEndTime].filter(Boolean).join(' – ');
    return `<div class="session-row">
      <span class="dot" style="background:${cardColor(c)}"></span>
      <div>
        <div class="session-client">${escapeHtml(c.client)}${PENCILLED_STATUSES.includes(c.status) ? ' <span class="card-tag">Tentative</span>' : ''}</div>
        <div class="session-meta">${escapeHtml([c.eventType, time, c.location].filter(Boolean).join(' · '))}</div>
      </div>
    </div>`;
  }).join('');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>🎉 ${sessions.length} session${sessions.length === 1 ? '' : 's'} today!</h2>
        <div class="session-list">${rows}</div>
        <div class="modal-actions"><div></div><button class="btn-primary" id="gotItBtn">Got it</button></div>
      </div>
    </div>
  `;
  document.getElementById('gotItBtn').onclick = closeModal;
  document.getElementById('overlay').addEventListener('click', (e) => { if(e.target.id === 'overlay') closeModal(); });
}

async function init(){
  document.getElementById('appVersion').textContent = APP_VERSION;
  renderViewerBanner();
  await loadState();
  activeTab = 'CONFIRMED';
  render();
  if(loadFailed) setBanner(LOAD_FAILED_MSG);
  const afterKey = () => {
    if(seededFresh && !isViewer && !loadFailed){
      saveState(ok => { if(ok) showToast('Disco Bookings is set up ✓ Your bookings list is saved'); });
    }
    checkSessionsToday();
  };
  if(previewMode){
    checkSessionsToday();
  } else if(!isViewer && !getEditKey()){
    openEditKeyModal(afterKey, () => checkSessionsToday());
  } else {
    afterKey();
  }
}

init();
</script>
</body>
